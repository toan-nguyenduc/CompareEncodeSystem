<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Evaluation Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-title">
                <i class="fa-solid fa-robot header-icon"></i>
                <div>
                    <h1>Auto Evaluation System</h1>
                    <p>Theo dõi quá trình mã hóa và tự động chấm điểm video AI</p>
                </div>
            </div>
            <div class="status-indicator">
                <span class="pulse-dot"></span> Socket Connected
            </div>
        </header>

        <section class="card add-video-section">
            <div class="card-header">
                <h2><i class="fa-solid fa-plus-circle"></i> Theo dõi Video mới</h2>
            </div>
            <div class="card-body">
                <form id="addVideoForm" class="add-video-form">
                    <div class="form-group">
                        <label for="csmId">CSM ID</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-database"></i>
                            <input type="number" id="csmId" name="csmId" required placeholder="Nhập ID...">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="peId">PE ID</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-film"></i>
                            <input type="number" id="peId" name="peId" required placeholder="Nhập ID...">
                        </div>
                    </div>
                    <div class="form-group btn-group" style="align-items: flex-end; display: flex;">
                        <button type="submit" class="btn btn-primary" id="addBtn">
                            <i class="fa-solid fa-paper-plane"></i> Theo Dõi Ngay
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section class="card video-list-section">
            <div class="card-header">
                <h2><i class="fa-solid fa-list-check"></i> Danh sách đang theo dõi</h2>
            </div>
            <div class="table-responsive">
                <table id="videoTable" class="modern-table">
                    <thead>
                        <tr>
                            <th width="40"></th>
                            <th width="80">Track ID</th>
                            <th>CSM ID</th>
                            <th>Tên Video</th>
                            <th>PE ID</th>
                            <th>Priority</th>
                            <th>Trạng thái</th>
                            <th>Điểm VMAF</th>
                            <th>Cập nhật gần nhất</th>
                            <th width="150" class="text-right">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="videoTableBody">
                        <!-- Rows will be populated by JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- SockJS and STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <!-- Main App Logic -->
    <script src="app.js?v=9"></script>
</body>
</html>
