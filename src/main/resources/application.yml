spring:
  # ==========================================
  # CẤU HÌNH KẾT NỐI ĐA CƠ SỞ DỮ LIỆU (MULTI-DB)
  # ==========================================
  datasource:
    # 1. Database nội bộ của Auto Evaluation (Lưu danh sách video theo dõi)
    autoeval:
      jdbc-url: jdbc:mysql://localhost:3306/autoeval_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: password
      driver-class-name: com.mysql.cj.jdbc.Driver
      
    # 2. Database của hệ thống CSM (Đổi trạng thái để trigger encode)
    csm:
      jdbc-url: jdbc:mysql://localhost:3306/csm_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: password
      driver-class-name: com.mysql.cj.jdbc.Driver
      
    # 3. Database của hệ thống PE (Đọc convert_end_time để biết đã encode xong)
    pe:
      jdbc-url: jdbc:mysql://localhost:3306/pe_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: password
      driver-class-name: com.mysql.cj.jdbc.Driver

  # ==========================================
  # CẤU HÌNH HIBERNATE / JPA
  # ==========================================
  jpa:
    hibernate:
      # KHÔNG cho phép Spring Boot tự động tạo/xóa bảng trong DB
      # (Cực kỳ quan trọng khi lên Production, giữ nguyên là 'none')
      ddl-auto: none
    # In ra console các câu lệnh SQL để dễ debug
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# ==========================================
# CẤU HÌNH SERVER
# ==========================================
server:
  port: 8080   # Port chạy ứng dụng Spring Boot và giao diện Web

# ==========================================
# CẤU HÌNH NGHIỆP VỤ RIÊNG
# ==========================================
eval:
  service:
    # URL gọi sang hệ thống Đánh giá điểm số của team AI
    # Lưu ý: Khi lên Production phải đổi URL này thành IP thật
    url: http://localhost:8080/api/mock-evaluate

app:
  polling:
    # Thời gian Background Job ngủ giữa mỗi lần quét Database PE (Đơn vị: Mili-giây)
    # Ví dụ: 30000 = 30 giây, 5000 = 5 giây
    delay: 5000
